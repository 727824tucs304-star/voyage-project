worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 5m;

    log_format main '$remote_addr "$host" "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Control plane (registration, status, admin). Serves any host without a tenant block.
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 16k;

        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $control_upstream voyage-control:4000;
            proxy_pass http://$control_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # One file per tenant, written by the control plane (<slug>.conf).
    include /etc/nginx/tenants/*.conf;
}
