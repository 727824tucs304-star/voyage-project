<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vespera · Workspace Platform</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  header { background: #0f1f3d; color: #fff; padding: 14px 24px; font-weight: 600; display: flex; justify-content: space-between; }
  header a { color: #93c5fd; font-weight: 400; font-size: 14px; text-decoration: none; }
  main { max-width: 1140px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 16px; }
  label { display: block; font-size: 14px; margin-bottom: 12px; }
  input, select, textarea { box-sizing: border-box; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  input, select { width: 100%; margin-top: 4px; }
  textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; margin: 2px 0; }
  button.ghost { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  th { color: #64748b; font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .err { color: #dc2626; } .ok { color: #059669; } .muted { color: #64748b; font-size: 14px; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #e2e8f0; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .side { width: 200px; flex-shrink: 0; background: #0f1f3d; border-radius: 8px; padding: 10px; }
  .side a { display: block; padding: 9px 12px; border-radius: 6px; color: #cbd5e1; text-decoration: none; margin-bottom: 4px; font-size: 14px; }
  .side a.on, .side a:hover { background: #2563eb; color: #fff; }
  .main { flex: 1; min-width: 0; }
  pre { white-space: pre-wrap; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
  @media (max-width: 700px) { .layout { flex-direction: column; } .side { width: auto; display: flex; gap: 6px; } .side a { margin: 0; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  button.deploy { background: #16a34a; font-size: 16px; font-weight: 700; padding: 12px 22px; letter-spacing: .3px; }
  button.deploy:disabled { background: #94a3b8; }
  .badge { color: #0f172a; }
</style>
</head>
<body>
<header><span>Vespera · Workspace Platform</span><span><a href="#/admin">Admin</a> <a href="#" onclick="signOut();return false;" style="margin-left:14px">Sign out</a></span></header>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const TOKEN_KEY = 'voyageAdminToken';
let timer = null;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = () => sessionStorage.getItem(TOKEN_KEY);

async function api(method, url, body, tok) {
  const headers = {};
  if (body != null) headers['Content-Type'] = 'application/json';
  if (tok) headers.Authorization = `Bearer ${tok}`;
  const r = await fetch(url, { method, headers, body: body != null ? JSON.stringify(body) : undefined });
  const data = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
const A = (m, u, b) => api(m, u, b, token());

function shell(active, html) {
  app.innerHTML = `<div class="layout">
    <nav class="side">
      <a href="#/admin" class="${active === 'tenants' ? 'on' : ''}">Customers</a>
      <a href="#/admin/dev" class="${active === 'dev' ? 'on' : ''}">Deployment Manager</a>
      <a href="#/admin/billing" class="${active === 'billing' ? 'on' : ''}">Usage &amp; Billing</a>
    </nav>
    <div class="main">${html}</div></div>`;
}

function register() {
  app.innerHTML = `
    <div class="card" style="max-width:520px">
      <h2 style="margin-top:0">Create your Vespera workspace</h2>
      <p class="muted">Your organisation gets a private, isolated workspace for meeting recordings, transcripts and reports. Setup takes about a minute.</p>
      <form id="reg">
        <label>Organisation name<input name="companyName" required minlength="2" maxlength="80"></label>
        <label>Your name<input name="adminName" required minlength="2" maxlength="80"></label>
        <label>Email<input name="email" type="email" required maxlength="120"></label>
        <label>Password (min 8 characters)<input name="password" type="password" required minlength="8" maxlength="128"></label>
        <p id="msg" class="err"></p>
        <button id="go">Create workspace</button>
      </form>
    </div>`;
  document.getElementById('reg').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go');
    const msg = document.getElementById('msg');
    btn.disabled = true; msg.textContent = '';
    try {
      const r = await api('POST', '/api/register', Object.fromEntries(new FormData(e.target)));
      location.hash = `#/status/${r.slug}`;
    } catch (err) {
      msg.textContent = err.message; btn.disabled = false;
    }
  };
}

async function status(slug) {
  const draw = async () => {
    let t;
    try {
      t = await api('GET', `/api/tenants/${encodeURIComponent(slug)}`);
    } catch (err) {
      app.innerHTML = `<div class="card err">${esc(err.message)}</div>`;
      return;
    }
    const steps = Object.values((t.steps || []).reduce((acc, s) => ((acc[s.step] = s), acc), {}));
    const ready = t.status === 'ready';
    const heading = ready ? 'Your workspace is ready' : t.status === 'failed' ? 'Provisioning failed' : `Setting up ${esc(t.companyName)}…`;
    app.innerHTML = `
      <div class="card">
        <h2 style="margin-top:0">${heading}</h2>
        ${ready
          ? `<p>Your workspace is live:</p>
             <p style="font-size:18px"><a href="${esc(t.workspaceUrl)}" target="_blank" rel="noopener"><strong>${esc(t.workspaceUrl)}</strong></a></p>
             <p class="muted">Sign in with the email and password you registered with.</p>`
          : `<p class="muted">Status: ${esc(t.status)}${t.currentStep ? ' · ' + esc(t.currentStep) : ''}</p>`}
        ${t.status === 'failed' ? `<p class="err">${esc(t.errorMessage)}</p><button id="retry">Retry provisioning</button>` : ''}
        <table style="margin-top:12px">
          <tr><th>Step</th><th>Result</th><th>Detail</th></tr>
          ${steps.map((s) => `<tr><td>${esc(s.step)}</td><td class="${s.status === 'ok' ? 'ok' : s.status === 'failed' ? 'err' : 'muted'}">${esc(s.status)}</td><td class="muted">${esc(s.detail)}</td></tr>`).join('')}
        </table>
      </div>`;
    const retry = document.getElementById('retry');
    if (retry) retry.onclick = async () => { retry.disabled = true; try { await api('POST', `/api/tenants/${encodeURIComponent(slug)}/retry`); } catch (e) { alert(e.message); } timer = setTimeout(draw, 500); };
    if (ready || t.status === 'failed') return;
    timer = setTimeout(draw, 2000);
  };
  await draw();
}

function adminLogin() {
  app.innerHTML = `<div class="card" style="max-width:420px"><h2 style="margin-top:0">Admin sign-in</h2>
    <form id="af">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <p id="lmsg" class="err"></p>
      <button id="lgo">Sign in</button>
    </form></div>`;
  document.getElementById('af').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('lgo');
    const msg = document.getElementById('lmsg');
    btn.disabled = true; msg.textContent = '';
    try {
      const r = await api('POST', '/api/admin/login', Object.fromEntries(new FormData(e.target)));
      sessionStorage.setItem(TOKEN_KEY, r.token);
      route();
    } catch (err) {
      msg.textContent = err.message; btn.disabled = false;
    }
  };
}

function signOut() {
  api('POST', '/api/admin/logout', null, token()).catch(() => {}).finally(() => {
    sessionStorage.removeItem(TOKEN_KEY);
    location.hash = '#/admin';
    route();
  });
}

async function admin() {
  if (!token()) return adminLogin();
  let tenants, releases;
  try {
    [tenants, releases] = await Promise.all([A('GET', '/api/admin/tenants'), A('GET', '/api/admin/versions?product=vespera')]);
  } catch (err) {
    sessionStorage.removeItem(TOKEN_KEY);
    return adminLogin();
  }
  const label = (v) => String(v || '').toUpperCase();
  const rows = tenants.map((t) => {
    const legacy = t.product !== 'vespera';
    const choices = releases.versions.filter((v) => v !== t.version);
    const badge = legacy
      ? '<span class="badge" style="background:#fee2e2">Voyage (legacy)</span>'
      : '<span class="badge" style="background:#ede9fe">Vespera</span>';
    let actions = '';
    if (t.status === 'ready' && legacy) {
      actions = `<button data-action="migrate" data-slug="${esc(t.slug)}">Migrate to Vespera V1</button>`;
    } else if (t.status === 'ready') {
      actions = `<div class="bar">
        <select data-select="${esc(t.slug)}" style="width:auto" ${choices.length ? '' : 'disabled'}>${choices.map((v) => `<option value="${esc(v)}">${esc(label(v))}</option>`).join('') || '<option>no other releases</option>'}</select>
        <button data-action="deploy" data-slug="${esc(t.slug)}" ${choices.length ? '' : 'disabled'}>Deploy</button>
        ${t.previousVersion ? `<button class="ghost" data-action="rollback" data-slug="${esc(t.slug)}">Rollback</button>` : ''}
      </div>`;
    }
    if (t.status === 'failed') actions += ` <button class="ghost" data-action="retry" data-slug="${esc(t.slug)}">Retry</button>`;
    return `<tr>
      <td><strong>${esc(t.companyName)}</strong><div class="muted">${esc(t.adminEmail)}</div></td>
      <td><a href="http://${esc(t.domain)}" target="_blank" rel="noopener">${esc(t.domain)}</a></td>
      <td>${esc(t.databaseName)}</td>
      <td>${esc(t.containerName)}</td>
      <td>${badge}<div><span class="badge">${esc(label(t.version))}</span></div></td>
      <td>${esc(t.status)}${t.currentStep ? `<div class="muted">${esc(t.currentStep)}</div>` : ''}${t.errorMessage ? `<div class="err" style="font-size:12px">${esc(t.errorMessage)}</div>` : ''}</td>
      <td>${actions}</td>
    </tr>`;
  });
  shell('tenants', `
    <div class="card">
      <div class="bar" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">Customers (${tenants.length})</h2>
        <span class="muted">Vespera releases: ${releases.versions.map(label).join(', ') || 'none yet'} · next: ${esc(label(releases.next))}</span>
      </div>
      <div class="bar" style="margin-bottom:10px">
        <button data-action="build-release">Build ${esc(String(releases.next).toUpperCase())} from latest commit</button>
      </div>
      <p id="amsg" class="muted" style="margin:6px 0"></p>
      <div id="bprog">${window.__buildPanel || ''}</div>
      <div style="overflow-x:auto"><table>
        <tr><th>Customer</th><th>Domain</th><th>Database</th><th>Container</th><th>Product · release</th><th>Status</th><th>Actions</th></tr>
        ${rows.join('') || '<tr><td colspan="7" class="muted">No customers yet.</td></tr>'}
      </table></div>
      <p class="muted" style="font-size:13px">Legacy Voyage workspaces keep running their current release until you migrate them one at a time. Nothing changes automatically.</p>
    </div>`);
  if (tenants.some((t) => t.status === 'provisioning' || t.status === 'updating')) timer = setTimeout(admin, 3000);
}

const CHANGE = { added: ['added', '#059669'], modified: ['modified', '#2563eb'], deleted: ['deleted', '#dc2626'], renamed: ['renamed', '#7c3aed'] };
let currentSlug = null, lastSeenSha = null, devTimer = null, relPoll = null;
const short = (s) => (s || '').slice(0, 7);
const when = (d) => (d ? new Date(d).toLocaleString() : '—');

function say(text, bad) {
  const m = document.getElementById('dmsg');
  if (!m) return;
  m.textContent = text;
  m.className = bad ? 'err' : 'muted';
}

function fileTable(files) {
  return `<table>${files.map((f) => {
    const [label, color] = CHANGE[f.status] || [f.status, '#64748b'];
    return `<tr><td style="width:90px"><span class="badge" style="background:${color};color:#fff">${esc(label)}</span></td><td><code>${esc(f.path)}</code></td></tr>`;
  }).join('')}</table>`;
}

function describeStatus(s) {
  const d = s.latestDeployment, b = s.latestBuild;
  if (s.deploying && b && b.status === 'running') {
    return `<p class="muted">Building image ${esc(b.version)} from commit ${esc(short(b.commit_hash))}…</p>`;
  }
  if (d && d.status === 'running') {
    return `<p class="muted">Deploying ${esc(d.to_version)} to this client. Waiting for the new container to pass its health check…</p>`;
  }
  if (d && d.status === 'succeeded') return `<p class="ok">Deployed ${esc(d.to_version)}. Health check passed.</p>`;
  if (d && d.status === 'rolled_back') return `<p class="err">Update failed and was rolled back: ${esc(d.detail || '')}</p>`;
  if (d && d.status === 'failed') {
    const log = d.detail && d.detail.includes('build') && b && b.status === 'failed' ? `<pre>${esc(b.log_tail)}</pre>` : '';
    return `<p class="err">Deployment failed: ${esc(d.detail || 'unknown error')}</p>${log}`;
  }
  return '';
}

async function devManager() {
  if (!token()) return adminLogin();
  clearInterval(devTimer); clearInterval(relPoll);
  shell('dev', '<p class="muted">Loading…</p>');
  let tenants;
  try {
    tenants = await A('GET', '/api/admin/tenants');
  } catch (e) {
    return shell('dev', `<div class="card err">${esc(e.message)}</div>`);
  }
  if (!tenants.length) return shell('dev', '<div class="card"><p>No customers yet. Register one first.</p></div>');
  if (!tenants.some((t) => t.slug === currentSlug)) currentSlug = tenants[0].slug;
  shell('dev', `
    <div class="card bar">
      <h2 style="margin:0;flex:1">Deployment Manager</h2>
      <label style="margin:0">Target customer&nbsp;
        <select id="tsel" style="width:auto">${tenants.map((t) =>
          `<option value="${esc(t.slug)}" ${t.slug === currentSlug ? 'selected' : ''}>${esc(t.companyName)}</option>`).join('')}</select>
      </label>
    </div>
    <div class="grid2">
      <div class="card" id="pDeployed"><p class="muted">Loading…</p></div>
      <div class="card" id="pLatest"><p class="muted">Loading…</p></div>
    </div>
    <div class="card" id="pChanges"><p class="muted">Loading…</p></div>
    <div class="card">
      <div class="bar">
        <select id="csel" style="flex:1"></select>
        <button id="deployBtn" class="deploy">DEPLOY CHANGES</button>
      </div>
      <p class="muted" style="font-size:13px">Developers push from VS Code. This page reads GitHub every minute and shows what this customer has not received yet.</p>
      <p id="dmsg" class="muted"></p>
      <div id="pStatus"></div>
    </div>
    <div class="card"><h2 style="margin-top:0">Deployment history</h2><div id="pHistory"></div></div>`);
  document.getElementById('tsel').onchange = (e) => { currentSlug = e.target.value; devManager(); };
  document.getElementById('deployBtn').onclick = deployChanges;
  await refreshDev(true);
  devTimer = setInterval(() => refreshDev(false), 60000);
}

async function refreshDev(first) {
  const slug = currentSlug;
  const q = encodeURIComponent(slug);
  let data;
  try {
    data = await Promise.all([
      A('GET', '/api/admin/tenants'),
      A('GET', `/api/admin/github/changes?slug=${q}`),
      A('GET', '/api/admin/github/commits'),
      A('GET', `/api/admin/releases/history?slug=${q}`),
      A('GET', `/api/admin/releases/status?slug=${q}`),
      A('GET', '/api/admin/products/vespera/builds'),
    ]);
  } catch (e) {
    return say(e.message, true);
  }
  if (currentSlug !== slug || !document.getElementById('pDeployed')) return;
  const [tenants, changes, commits, hist, status, builds] = data;
  const t = tenants.find((x) => x.slug === slug);
  const latest = changes.latest;
  const newCommit = !first && lastSeenSha && latest && latest.sha !== lastSeenSha;
  if (newCommit) say(`New commit pushed to GitHub: ${latest.message}`);
  lastSeenSha = latest?.sha || lastSeenSha;
  const lastDeployed = hist.find((h) => h.status === 'succeeded');
  const lastAttempt = hist[0];

  document.getElementById('pDeployed').innerHTML = `
    <h3 style="margin-top:0">Deployed on this customer</h3>
    <p>Release: <span class="badge" style="background:#e2e8f0">${esc(String(t.version).toUpperCase())}</span></p>
    <p>Commit: ${changes.baseline ? `<code>${esc(short(changes.baseline))}</code> ${esc(lastDeployed?.commit_message || '')}`
      : '<span class="muted">not tracked yet (deploy a commit to start tracking)</span>'}</p>
    <p>Last deployment: ${lastAttempt ? `${esc(when(lastAttempt.created_at))} · <span class="${lastAttempt.status === 'succeeded' ? 'ok' : lastAttempt.status === 'running' ? 'muted' : 'err'}">${esc(lastAttempt.status)}</span>` : '<span class="muted">none yet</span>'}</p>`;

  document.getElementById('pLatest').innerHTML = latest ? `
    <h3 style="margin-top:0">Latest commit on GitHub ${newCommit ? '<span class="badge" style="background:#fde68a">new</span>' : ''}</h3>
    <p><code>${esc(latest.short)}</code> ${esc(latest.message)}</p>
    <p class="muted">by ${esc(latest.author)} · ${esc(when(latest.date))}</p>` : '<p class="muted">No commits found on GitHub.</p>';

  let pending;
  if (changes.baseline === null) {
    pending = `<h3 style="margin-top:0">Files in the latest commit</h3>
      <p class="muted">Nothing is recorded as deployed to this customer yet, so every file counts as new.</p>${fileTable(changes.latestFiles || [])}`;
  } else if (changes.upToDate) {
    pending = `<h3 style="margin-top:0">Changes not yet deployed</h3><p class="ok">Nothing to deploy: this customer already runs the latest commit.</p>`;
  } else {
    pending = `<h3 style="margin-top:0">Changes not yet deployed</h3>${changes.files.length
      ? fileTable(changes.files) : '<p class="muted">No file changes since the deployed commit.</p>'}`;
  }
  document.getElementById('pChanges').innerHTML = pending;

  const csel = document.getElementById('csel');
  const keep = csel.value;
  const builtVersion = new Map((builds || []).filter((b) => b.status === 'succeeded').map((b) => [b.commit_hash, b.version]));
  csel.innerHTML = commits.map((c) => {
    const v = builtVersion.get(c.sha);
    return `<option value="${esc(c.sha)}">${esc(v ? String(v).toUpperCase() : 'Not built')} · ${esc(c.short)} · ${esc(c.message)}</option>`;
  }).join('');
  if (keep && commits.some((c) => c.sha === keep)) csel.value = keep;

  const busy = status.deploying || (status.latestDeployment && status.latestDeployment.status === 'running');
  document.getElementById('deployBtn').disabled = !!busy || (changes.baseline !== null && changes.upToDate);
  document.getElementById('pStatus').innerHTML = describeStatus(status);

  document.getElementById('pHistory').innerHTML = `<table>
    <tr><th>When</th><th>Action</th><th>From → To</th><th>Commit</th><th>Message</th><th>Result</th><th></th></tr>
    ${hist.map((h) => `<tr>
      <td class="muted">${esc(when(h.created_at))}</td>
      <td>${esc(h.kind)}</td>
      <td>${esc(h.from_version || '—')} → ${esc(String(h.to_version).toUpperCase())}</td>
      <td><code>${esc(short(h.commit_hash))}</code></td>
      <td>${esc(h.commit_message || '')}</td>
      <td class="${h.status === 'succeeded' ? 'ok' : h.status === 'running' ? 'muted' : 'err'}">${esc(h.status)}${h.detail ? `<div class="muted" style="font-size:12px">${esc(h.detail)}</div>` : ''}</td>
      <td>${h.status === 'succeeded' && h.to_version !== t.version
        ? `<button class="ghost" data-rollback="${esc(h.to_version)}">Roll back</button>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">No deployments yet.</td></tr>'}
  </table>`;
  document.querySelectorAll('[data-rollback]').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm(`Roll ${currentSlug} back to ${btn.dataset.rollback}? Its data is kept.`)) return;
      try {
        await A('POST', '/api/admin/releases/rollback', { slug: currentSlug, version: btn.dataset.rollback });
        say(`Rolling back to ${btn.dataset.rollback}…`);
        refreshDev(false);
      } catch (e) { say(e.message, true); }
    };
  });

  clearInterval(relPoll);
  if (busy) relPoll = setInterval(() => refreshDev(false), 2500);
}

async function deployChanges() {
  const sha = document.getElementById('csel').value;
  if (!sha) return say('Choose a commit first.', true);
  if (!confirm(`Deploy commit ${short(sha)} to this customer? Only this customer's workspace is replaced. Its data is kept.`)) return;
  try {
    await A('POST', '/api/admin/releases', { slug: currentSlug, sha });
    say('Deployment started. Status updates below as each step completes.');
    refreshDev(false);
  } catch (e) {
    say(e.message, true);
  }
}

let billState = { month: new Date().toISOString().slice(0, 7), slug: '' };
const money = (n) => `$${Number(n || 0).toFixed(2)}`;
const num = (n) => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const SYNC_TEXT = { ok: 'Synchronised', not_configured: 'Not configured: AWS permissions are missing', error: 'Last sync failed', never_synced: 'Never synchronised', running: 'Running' };

async function billingPage() {
  if (!token()) return adminLogin();
  shell('billing', '<p class="muted">Loading…</p>');
  try {
    const [b, tenants, pricing] = await Promise.all([
      A('GET', `/api/admin/billing?month=${encodeURIComponent(billState.month)}&slug=${encodeURIComponent(billState.slug)}`),
      A('GET', '/api/admin/tenants'),
      A('GET', '/api/admin/pricing'),
    ]);
    const history = billState.slug ? await A('GET', `/api/admin/billing/history?slug=${encodeURIComponent(billState.slug)}`) : [];
    renderBilling(b, tenants, pricing, history);
  } catch (e) {
    shell('billing', `<div class="card err">${esc(e.message)}</div>`);
  }
}

function renderBilling(b, tenants, pricing, history) {
  const o = b.overview;
  const totals = b.tenants.reduce((t, x) => ({
    requests: t.requests + x.requests, storage: t.storage + x.storage_mb, net: t.net + x.network_gb,
    cpu: t.cpu + x.cpu_avg_percent, mem: t.mem + x.mem_avg_gb, n: t.n + 1,
  }), { requests: 0, storage: 0, net: 0, cpu: 0, mem: 0, n: 0 });
  const maxReq = Math.max(1, ...b.daily.map((d) => d.requests));
  const bars = b.daily.map((d) => `<div title="${esc(d.day)}: ${num(d.requests)} requests"
    style="flex:1;background:#2563eb;height:${Math.max(2, (d.requests / maxReq) * 120)}px;border-radius:3px 3px 0 0"></div>`).join('');
  const rate = (k) => pricing.rates[k];
  const rateRows = Object.keys(pricing.labels).map((k) =>
    `<label style="display:flex;gap:10px;align-items:center;margin:6px 0"><span style="flex:1">${esc(pricing.labels[k])}</span>
     <input data-rate="${esc(k)}" type="number" step="any" min="0" value="${esc(rate(k))}" style="width:130px"></label>`).join('');
  shell('billing', `
    <div class="card bar">
      <h2 style="margin:0;flex:1">Usage &amp; Billing</h2>
      <label style="margin:0">Month <input id="bMonth" type="month" value="${esc(b.month)}" style="width:auto"></label>
      <label style="margin:0">Client <select id="bSlug" style="width:auto"><option value="">All clients</option>
        ${tenants.map((t) => `<option value="${esc(t.slug)}" ${t.slug === billState.slug ? 'selected' : ''}>${esc(t.companyName)}</option>`).join('')}</select></label>
      <button class="ghost" id="bCollect">Collect usage now</button>
      <button class="ghost" id="bSync">Sync AWS costs</button>
    </div>
    <p class="muted" style="margin:4px 0 12px">Estimated figures are calculated by the platform. AWS-reported figures come from Cost Explorer and are delayed about one day.</p>
    <div class="grid2" style="grid-template-columns:repeat(4,1fr)">
      <div class="card" style="padding:14px"><div class="muted">AWS infrastructure cost</div><div style="font-size:22px;font-weight:600">${money(o.aws_total)}</div><span class="badge" style="background:#e0e7ff">AWS-reported</span></div>
      <div class="card" style="padding:14px"><div class="muted">Estimated customer charges</div><div style="font-size:22px;font-weight:600">${money(o.customer_charges)}</div><span class="badge" style="background:#dcfce7">Estimated</span></div>
      <div class="card" style="padding:14px"><div class="muted">Allocated infrastructure cost</div><div style="font-size:22px;font-weight:600">${money(o.allocated_aws)}</div><span class="badge" style="background:#dcfce7">Estimated</span></div>
      <div class="card" style="padding:14px"><div class="muted">Active clients</div><div style="font-size:22px;font-weight:600">${o.active_tenants}</div><span class="badge" style="background:#dcfce7">Live</span></div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="card">
        <h3 style="margin-top:0">AWS cost overview</h3>
        <p>Status: <strong>${esc(SYNC_TEXT[b.aws_sync.status] || b.aws_sync.status)}</strong></p>
        <p class="muted">${esc(b.aws_sync.message || '')}</p>
        <p class="muted">Last successful sync: ${esc(b.aws_sync.last_success ? new Date(b.aws_sync.last_success).toLocaleString() : 'never')}</p>
        ${b.aws.services.length ? `<table><tr><th>Service</th><th>Cost</th></tr>${b.aws.services.map((s) =>
          `<tr><td>${esc(s.service)}</td><td>${money(s.amount)}</td></tr>`).join('')}</table>` : '<p class="muted">No AWS cost data for this month yet.</p>'}
        <p class="muted" style="margin-top:8px">Unallocated AWS cost (not charged to clients): ${money(o.unallocated_aws)}</p>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Usage analytics (all clients)</h3>
        <table>
          <tr><td>API requests</td><td style="text-align:right">${num(totals.requests)}</td></tr>
          <tr><td>Average CPU per client</td><td style="text-align:right">${totals.n ? num(totals.cpu / totals.n) : 0}%</td></tr>
          <tr><td>Average memory per client</td><td style="text-align:right">${totals.n ? num(totals.mem / totals.n) : 0} GB</td></tr>
          <tr><td>Database storage (peak, sum)</td><td style="text-align:right">${num(totals.storage)} MB</td></tr>
          <tr><td>Network transfer</td><td style="text-align:right">${num(totals.net)} GB</td></tr>
        </table>
        <h3>Daily API requests</h3>
        <div style="display:flex;gap:3px;align-items:flex-end;height:130px;border-bottom:1px solid #e2e8f0">${bars || '<span class="muted">No daily data for this month yet.</span>'}</div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Tenant breakdown</h3>
      <div style="overflow-x:auto"><table>
        <tr><th>Client</th><th>Requests</th><th>CPU avg</th><th>Memory avg</th><th>Storage</th><th>Network</th><th>Usage charges</th><th>Allocated AWS</th><th>Total estimated bill</th></tr>
        ${b.tenants.map((t) => `<tr data-tenant="${esc(t.slug)}" style="cursor:pointer">
          <td><strong>${esc(t.company_name)}</strong></td><td>${num(t.requests)}</td><td>${num(t.cpu_avg_percent)}%</td>
          <td>${num(t.mem_avg_gb)} GB</td><td>${num(t.storage_mb)} MB</td><td>${num(t.network_gb)} GB</td>
          <td>${money(t.usage_charges)}</td><td>${money(t.allocated_aws.total)}</td>
          <td><strong>${money(t.total_bill)}</strong></td></tr>`).join('') || '<tr><td colspan="9" class="muted">No clients yet.</td></tr>'}
      </table></div>
      <p class="muted" style="font-size:13px">Allocated AWS = EC2 cost shared by CPU and memory use, EBS by storage, and data transfer by network. Click a row to see its history.</p>
    </div>
    ${billState.slug && history.length ? `<div class="card" style="margin-top:16px"><h3 style="margin-top:0">Billing history</h3>
      <table><tr><th>Month</th><th>Usage charges</th><th>Allocated AWS</th><th>Platform fee</th><th>Total</th></tr>
      ${history.map((h) => `<tr><td>${esc(h.month)}</td><td>${money(h.usage_charges)}</td><td>${money(h.allocated_aws)}</td><td>${money(h.platform_fee)}</td><td><strong>${money(h.total)}</strong></td></tr>`).join('')}
      </table></div>` : ''}
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Pricing</h3>
      <p class="muted">Changes apply to the next calculation. Allocation weights must add up to 1.</p>
      ${rateRows}
      <div class="bar" style="margin-top:10px"><button id="pSave">Save pricing</button><span id="pMsg" class="muted"></span></div>
    </div>`);

  document.getElementById('bMonth').onchange = (e) => { billState.month = e.target.value; billingPage(); };
  document.getElementById('bSlug').onchange = (e) => { billState.slug = e.target.value; billingPage(); };
  document.getElementById('bCollect').onclick = async () => {
    try { await A('POST', '/api/admin/usage/collect'); billingPage(); } catch (e) { alert(e.message); }
  };
  document.getElementById('bSync').onclick = async () => {
    try { await A('POST', '/api/admin/aws/sync'); billingPage(); } catch (e) { alert(e.message); }
  };
  document.querySelectorAll('[data-tenant]').forEach((tr) => tr.onclick = () => { billState.slug = tr.dataset.tenant; billingPage(); });
  document.getElementById('pSave').onclick = async () => {
    const rates = {};
    document.querySelectorAll('[data-rate]').forEach((i) => { rates[i.dataset.rate] = i.value; });
    const msg = document.getElementById('pMsg');
    try {
      await A('PUT', '/api/admin/pricing', { rates });
      msg.textContent = 'Saved. Bills recalculate on the next view.';
      msg.className = 'ok';
      setTimeout(billingPage, 600);
    } catch (e) { msg.textContent = e.message; msg.className = 'err'; }
  };
}

app.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const slug = btn.dataset.slug;
  const msg = document.getElementById('amsg');
  try {
    if (btn.dataset.action === 'deploy') {
      const version = document.querySelector(`select[data-select="${slug}"]`).value;
      await A('POST', `/api/admin/tenants/${encodeURIComponent(slug)}/deploy`, { version });
      msg.textContent = `Deploying ${version} to ${slug}. Other tenants are not touched.`;
    } else if (btn.dataset.action === 'rollback') {
      await A('POST', `/api/admin/tenants/${encodeURIComponent(slug)}/rollback`);
      msg.textContent = `Rolling ${slug} back to its previous version.`;
    } else if (btn.dataset.action === 'migrate') {
      await A('POST', `/api/admin/tenants/${encodeURIComponent(slug)}/migrate-to-vespera`, { version: 'v1' });
      msg.textContent = `Migrating ${slug} to Vespera V1. Its data, domain and files are kept.`;
    } else if (btn.dataset.action === 'build-release') {
      const commits = await A('GET', '/api/admin/github/commits');
      if (!commits.length) throw new Error('No commits were found on the configured branch, so there is nothing to build.');
      const r = await A('POST', '/api/admin/products/vespera/build', { sha: commits[0].sha });
      msg.textContent = `Building Vespera ${String(r.version).toUpperCase()} from commit ${commits[0].short}. Progress is shown below.`;
      watchBuild(r.id);
    } else if (btn.dataset.action === 'retry') {
      await api('POST', `/api/tenants/${encodeURIComponent(slug)}/retry`);
      msg.textContent = `Retrying provisioning for ${slug}.`;
    }
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'err';
  }
  clearTimeout(timer);
  timer = setTimeout(admin, 800);
});

const BUILD_STAGES = [['starting', 'Preparing build'], ['building', 'Building image'], ['tagging', 'Tagging release'], ['done', 'Ready to deploy']];
function progressHtml(b) {
  const p = b.progress || { key: 'starting', percent: 5, detail: '' };
  const failed = b.status === 'failed';
  const done = b.status === 'succeeded';
  const current = BUILD_STAGES.findIndex(([k]) => k === p.key);
  const steps = BUILD_STAGES.map(([k, name], i) => {
    const isDone = done || (!failed && current > i);
    const isActive = !failed && !done && i === current;
    const mark = isDone ? '✓' : isActive ? '…' : '○';
    const colour = isDone ? '#047857' : isActive ? '#4c1d95' : '#94a3b8';
    const detail = isActive && p.detail ? ` (${esc(p.detail)})` : '';
    return `<li style="color:${colour}">${mark} ${esc(name)}${detail}</li>`;
  }).join('');
  const bar = failed ? '' : `<div style="background:#e2e8f0;border-radius:6px;height:8px;margin:8px 0"><div style="background:#4c1d95;height:8px;border-radius:6px;width:${done ? 100 : p.percent}%"></div></div>`;
  const title = failed ? 'Failed' : done ? 'Ready to deploy' : 'Building';
  const errorText = failed ? `<pre style="white-space:pre-wrap;font-size:12px;background:#fef2f2;padding:8px;border-radius:6px">${esc(b.log_tail || 'The build failed. See the server log.')}</pre>` : '';
  return `<div class="card" style="margin:8px 0"><strong>Vespera ${esc(String(b.version).toUpperCase())} · ${title}</strong>${bar}<ul style="list-style:none;padding:0;margin:6px 0;font-size:14px">${steps}</ul>${errorText}</div>`;
}
var buildWatching = false;
async function watchBuild(id) {
  if (buildWatching) return;
  buildWatching = true;
  let attempts = 0;
  const tick = async () => {
    try {
      const builds = await A('GET', '/api/admin/products/vespera/builds');
      const b = id ? builds.find((x) => x.id === id) : builds.find((x) => x.status === 'running');
      if (b) {
        window.__buildPanel = progressHtml(b);
        const box = document.getElementById('bprog');
        if (box) box.innerHTML = window.__buildPanel;
        if (b.status === 'running') return setTimeout(tick, 3000);
      } else if (id && attempts++ < 40) {
        return setTimeout(tick, 3000);
      }
      buildWatching = false;
    } catch (e) {
      buildWatching = false;
    }
  };
  tick();
}
// Resume showing a build that is still running after the page was reloaded.
window.addEventListener('load', () => watchBuild(null));

function route() {
  clearTimeout(timer);
  const h = location.hash || '#/';
  if (h.startsWith('#/status/')) return status(decodeURIComponent(h.slice(9)));
  if (h === '#/admin/billing') return billingPage();
  if (h === '#/admin/dev') return devManager();
  if (h === '#/admin') return admin();
  return register();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
