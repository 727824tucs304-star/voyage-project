# Runs on every push and pull request. Free for public repositories.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test Vespera
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo systemctl status postgresql --no-pager

      - name: Build the customer web app
        working-directory: voyage/tenant-app
        run: |
          npm ci
          npm run build

      - name: Make test helper scripts executable
        run: |
          chmod +x voyage/control-plane/test/*.sh voyage/control-plane/test/*.mjs

      - name: Run the control-plane test suite (91 checks)
        working-directory: voyage/control-plane
        run: |
          npm ci
          # The test suite creates test databases as the postgres user, which needs root.
          sudo env "PATH=$PATH" node test/run.mjs

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/control.log
          if-no-files-found: ignore

  terraform:
    name: Validate infrastructure code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        working-directory: voyage/infra
        run: terraform fmt -check -recursive

      - name: Initialise without a backend (no AWS access needed)
        working-directory: voyage/infra
        run: terraform init -backend=false

      - name: Validate configuration
        working-directory: voyage/infra
        run: terraform validate
